name: Code review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-cr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review'
    runs-on: ubuntu-latest
    steps:
      - name: Detect fork
        id: fork
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from "node:fs";
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const head = event.pull_request.head.repo;
          const base = event.pull_request.base.repo.full_name;
          const line = head == null || head.full_name !== base ? "fork=true\n" : "fork=false\n";
          appendFileSync(process.env.GITHUB_OUTPUT, line);
          EOF

      - name: Checkout pull request head
        if: steps.fork.outputs.fork != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Write pull request diff
        if: steps.fork.outputs.fork != 'true'
        run: git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > "${{ github.workspace }}/pr.diff"

      - name: Review pull request
        if: steps.fork.outputs.fork != 'true'
        uses: ./.github/actions/code-review
        with:
          diff-path: ${{ github.workspace }}/pr.diff
          title: ${{ github.event.pull_request.title }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
