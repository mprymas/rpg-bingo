name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run test:unit
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: |
          npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      # CLI ~2.117: `supabase seed` only has `buckets` (storage). [db.seed] sql_paths run on
      # `db reset`, not reliably on `start`. Apply seed.sql locally via db query — never --linked.
      - name: Seed local catalog
        run: npx supabase db query --local -f supabase/seed.sql
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Create smoke user
        run: |
          source supabase.env
          curl -sf -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"mg.manual@rpgbingo.test","password":"Manual-Test-Passw0rd!","email_confirm":true}'
      - name: Create second integration GM
        run: |
          source supabase.env
          curl -sf -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"mg.other@rpgbingo.test","password":"Other-Test-Passw0rd!","email_confirm":true}'
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          SMOKE_EMAIL=mg.manual@rpgbingo.test SMOKE_PASSWORD='Manual-Test-Passw0rd!' BASE_URL=http://localhost:4321 npm run smoke
      - name: Run Vitest integration against production preview
        run: |
          SMOKE_EMAIL=mg.manual@rpgbingo.test \
          SMOKE_PASSWORD='Manual-Test-Passw0rd!' \
          TEST_EMAIL_B=mg.other@rpgbingo.test \
          TEST_PASSWORD_B='Other-Test-Passw0rd!' \
          BASE_URL=http://localhost:4321 \
          PREVIEW_BASE_URL=http://localhost:4321 \
          npm run test:integration
      - if: always()
        run: |
          if [ -x node_modules/.bin/supabase ]; then
            npx supabase stop --no-backup
          fi

  deploy:
    needs: [ci, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ github.sha }}"
